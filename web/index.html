<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenLevy · class dues on Lightning</title>
<meta name="description" content="Collect class dues by Bitcoin Lightning. Everyone sees who paid, and every spend can be proven.">
<meta name="theme-color" content="#0f3d2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f3d2e'/%3E%3Cpath d='M18 4 8 18h7l-2 10 10-14h-7z' fill='%23f7b538'/%3E%3C/svg%3E">
<style>
:root{--ink:#14211b;--muted:#5d6b64;--bg:#f6f4ee;--card:#fff;--green:#0f3d2e;--gold:#f7b538;--ok:#1b7f4b;--warn:#b26b00;--bad:#b3261e;--line:#e3e0d6}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-weight:700}header nav a{font-weight:500;margin-left:14px;opacity:.9}
.logo:before{content:"⚡";color:var(--gold);margin-right:4px}
#test{background:var(--gold);color:#3b2a00;text-align:center;font-size:13px;padding:4px 8px;display:none}
main{max-width:560px;margin:0 auto;padding:8px 14px 60px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:24px;line-height:1.2;margin:4px 0 8px}h2{font-size:18px;margin:0 0 10px}h3{margin:0 0 8px}
.hero{background:var(--green);color:#fff;border:0}.hero p{opacity:.9}
.muted{color:var(--muted)}.hero .muted{color:#cfe3d9}.small{font-size:14px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:13px 14px;margin:8px 0;font:inherit;font-weight:700;background:var(--gold);color:#2a1f00;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}.btn.small{padding:9px;font-size:15px}
.btn:disabled{opacity:.6}
label{display:block;margin:10px 0;font-weight:600}label small{display:block;font-weight:400;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;font:inherit;border:1px solid #c9c4b6;border-radius:9px;background:#fff;color:var(--ink)}
label.check{display:flex;gap:8px;align-items:center;font-weight:500}label.check input{width:auto;margin:0}
.hide{display:none}
.kicker{margin:0;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.amt{font-size:28px;font-weight:800;margin:0}.amt span{font-size:16px;color:var(--muted);font-weight:500}
.share{display:flex;gap:8px}.share .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;padding:12px 8px}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--muted)}
.person,.spend,.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.person:last-child,.spend:last-child{border:0}
.person em{font-style:normal;font-weight:700;white-space:nowrap}.person.paid em{color:var(--ok)}.person.pending em{color:var(--warn)}.person.unpaid em{color:var(--muted)}
.spend small{display:block;color:var(--muted)}.spend>div:last-child{text-align:right}
.badge{display:inline-block;font-size:12px;border-radius:20px;padding:2px 8px;margin-top:2px}
.badge.proven{background:#dff3e7;color:var(--ok)}.badge.claimed{background:#fdf0d8;color:var(--warn)}.badge.mismatch{background:#fbe1df;color:var(--bad)}
.invoice{text-align:center;margin-top:10px}.invoice img{width:240px;max-width:100%;image-rendering:pixelated;border:8px solid #fff;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
.ok{color:var(--ok)}
.how ol{padding-left:20px;margin:0}.how li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;max-width:92%;transition:transform .2s;z-index:20}
#toast.show{transform:translateX(-50%)}#toast.bad{background:var(--bad)}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px}
footer{text-align:center;font-size:13px;color:var(--muted);padding:10px}footer a{color:inherit}
</style>
</head>
<body>
<header><a class="logo" href="#/">OpenLevy</a><nav><a href="#/new">New levy</a><a href="#/wallet">Wallet</a></nav></header>
<div id="test">Test mode: demo wallets use fake sats. No real money moves.</div>
<main id="app"><section><p class="muted">Loading…</p></section></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer>Open source · <a href="https://github.com/yunganas/openlevy">GitHub</a> · Built for the Dakar Bitcoin Hack 2026</footer>
<noscript><p style="padding:16px">OpenLevy needs JavaScript to check payments.</p></noscript>
<script src="app.js"></script>
</body>
</html>
